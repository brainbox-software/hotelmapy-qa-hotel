<body>
<script>QA.header()</script>
<div class="hero"><h1>Wellness</h1></div>
<main>
  <p class="filler">The two-part snippet from the cookie-tool guide's Cookiebot row: the empty div marks the place, the tag marked <code>data-cookieconsent="marketing"</code> fills it once the visitor allows marketing cookies. Reject first, then accept via "Cookie settings" below.</p>
  <script>
    if (!QA.settings.cbid) {
      document.write('<p class="qa-warn">No Cookiebot ID: open this page with ?cbid=&lt;domain group id&gt;, or set COOKIEBOT_ID in site.js.</p>');
    }
  </script>
  <script>QA.paste('<div data-hotelmapy-embed data-hotel-id="{MAP}"></div>\n<script type="text/plain" data-cookieconsent="marketing" src="{APP}/embed/hotelmapy.js" data-hotel-id="{MAP}" data-height="600px"><\/script>')</script>
  <p><button onclick="Cookiebot.renew()">Cookie settings</button></p>
</main>
<footer>Hotel Seeblick · not a real hotel</footer>
</body>
</html>
